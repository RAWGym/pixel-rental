<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0E0D0C" />
<title>Нет сети · Pixel Rental</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0E0D0C; color: #F2EEE9; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, "Segoe UI", system-ui, sans-serif; }
  main { min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; text-align: center; }
  .box { max-width: 340px; display: grid; gap: 14px; justify-items: center; }
  .ico { width: 64px; height: 64px; border-radius: 20px; background: rgba(255,150,47,.14); color: #FF962F; display: grid; place-items: center; font-size: 30px; }
  h1 { font-size: 22px; margin: 6px 0 0; font-weight: 600; }
  p { color: #9A928A; margin: 0; line-height: 1.5; font-size: 15px; }
  button { margin-top: 8px; height: 48px; padding: 0 22px; border-radius: 14px; border: 0; background: #FF962F; color: #1C0F02; font-weight: 600; font-size: 15px; font-family: inherit; }
</style>
</head>
<body>
<main>
  <div class="box">
    <img src="/logo.svg" alt="Rental Pixel" width="220" height="27" style="margin-bottom:10px">
    <div class="ico" aria-hidden="true">⌁</div>
    <h1>Нет подключения</h1>
    <p>Проверьте интернет. Каталог и корзина сохранились. Как только сеть вернётся, всё продолжит работать.</p>
    <button onclick="location.reload()">Повторить</button>
  </div>
</main>
</body>
</html>
